[package]
name = "otwin-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Otwin physics engine."
# Shipped to PyPI as a wheel (otwin-engine), not to crates.io: it is a Python
# extension module, and nothing on the Rust side would depend on it.
publish = false

[lib]
name = "otwin_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
otwin-core = { path = "../otwin-core", version = "2.0.1" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
numpy = "0.27"
serde_json = "1"
