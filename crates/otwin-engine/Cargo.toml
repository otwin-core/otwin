[package]
name = "otwin-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the OTwin dynamics engine."

[lib]
name = "otwin_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
otwin-core = { path = "../otwin-core", version = "2.0.1" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
numpy = "0.27"
serde_json = "1"
