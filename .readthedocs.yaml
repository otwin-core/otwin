# Read the Docs build. https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The package itself is installed, not just its documentation dependencies:
# autodoc imports every module to read its signatures, so a docs build that
# cannot import otwin produces a reference section full of silent gaps rather
# than an error.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Warnings are errors. A broken cross-reference renders as plain text and
  # nobody notices for six months.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - gp

formats:
  - pdf
  - htmlzip
