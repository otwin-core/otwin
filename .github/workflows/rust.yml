# The Rust side: the engine crate on its own, then the whole Python suite with
# the compiled engine installed. The Python workflow runs the same suite on the
# NumPy fallback; the two together are the parity guarantee the runtime makes.
name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine crate on its own: formatting, lints, unit tests. No Python.
  rust:
    name: cargo test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p otwin-core -- -D warnings
      - run: cargo test -p otwin-core

  # The whole Python suite with the compiled engine installed.
  engine:
    name: engine wheel + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build the engine wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release -m crates/otwin-engine/Cargo.toml -o dist
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install dist/otwin_engine-*.whl
          python -c "import otwin; assert otwin.engine_available()"
      - name: Test
        run: pytest -q
      - name: Benchmark, for the log
        run: python benchmarks/bench_engine.py
