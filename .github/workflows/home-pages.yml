# Publish the Otwin Home wizard (apps/home/web) to GitHub Pages.
#
# Manual on purpose: publishing a public site is a maintainer's decision, so
# merging never deploys by surprise. Before the first run, set Settings ->
# Pages -> Source to "GitHub Actions". The site is static: the build
# downloads Pyodide, NumPy and SciPy once from their CDNs and embeds them;
# the published page then needs no server and uploads nothing.
name: Otwin Home site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package (the build bakes the wizard's questions)
        run: pip install -e .
      - name: Build the static site
        run: python apps/home/web/build_bundle.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/home/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
