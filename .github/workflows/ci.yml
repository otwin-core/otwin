name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run the worked example
        run: python examples/bess_end_to_end.py

  # The gate that matters. A fresh runner, a non-editable install, no source
  # checkout on the path, and the README quickstart copy-pasted verbatim.
  # Every packaging defect this project has shipped -- a test dependency
  # missing from the manifest, an extra that pulled 2 GB nobody needed, an
  # error raised in the wrong order -- was invisible in a developer
  # environment that had accumulated the missing pieces, and would have been
  # caught here.
  clean-install:
    name: clean install from a wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and install the wheel, nothing else
        run: |
          pip install --require-hashes -r .github/requirements/build.txt
          python -m build --wheel
          cd /tmp
          python -m venv fresh
          /tmp/fresh/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Base install is numpy and scipy only
        run: |
          installed=$(/tmp/fresh/bin/pip list --format=freeze \
            | grep -viE '^(pip|setuptools|wheel|otwin)==' | cut -d= -f1 | sort | tr '\n' ' ')
          echo "installed: $installed"
          test "$installed" = "numpy scipy " \
            || { echo "::error::base install pulled more than numpy and scipy"; exit 1; }
      - name: The README quickstart, copy-pasted, from outside the source tree
        # No engine wheel in this venv, on purpose: this is the NumPy fallback
        # path, the one a user without a binary wheel gets.
        run: |
          cd /tmp && /tmp/fresh/bin/python -W ignore::otwin.EngineNotAvailable - <<'PY'
          import otwin
          from otwin.components.mechanical import Mass, Spring, Damper, ForceSource, Fixed

          k, m, c, g0 = 20.0, 1.0, 0.3, 9.81
          mass, spring, damper = Mass(m, name="mass"), Spring(k, name="spring"), Damper(c, name="damper")
          weight, ceiling = ForceSource(m * g0, name="weight"), Fixed(name="ceiling")

          system = mass >> spring >> ceiling
          system.connect(mass.flange, damper.a, weight.flange)
          system.connect(damper.b, ceiling.port)

          model = otwin.compile(system)
          run = model.simulate(t_span=(0, 20), dt=0.05)
          q = run["spring.extension"]
          assert abs(q[-1] - m * g0 / k) < 0.02, q[-1]
          assert run.energy_balance()["max_violation"] <= 1e-12, "energy balance violated"
          print("quickstart ok on the", model.backend, "backend; final extension", float(q[-1]))
          PY

  # The engine crate on its own: formatting, lints, unit tests. No Python.
  rust:
    name: cargo test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p otwin-core -- -D warnings
      - run: cargo test -p otwin-core

  # The whole Python suite with the compiled engine installed. The `test` job
  # above runs the same suite on the NumPy fallback; the two together are the
  # parity guarantee the runtime makes.
  engine:
    name: engine wheel + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/otwin-engine/Cargo.toml -o dist
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install dist/otwin_engine-*.whl
          python -c "import otwin; assert otwin.engine_available()"
      - name: Test
        run: pytest -q
      - name: Benchmark, for the log
        run: python benchmarks/bench_engine.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples

  # Every file carries a license and a copyright holder (REUSE.toml covers the
  # tree; the license text is in LICENSES/). reuse.software reads the same
  # result for the badge in the README.
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r .github/requirements/reuse.txt
      - run: reuse lint

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }

      # autodoc imports every module to read its signatures. A docs build that
      # cannot import otwin does not fail -- it produces a reference section
      # full of silent gaps -- so the package is installed, not just Sphinx.
      - name: Install
        run: |
          pip install -r docs/requirements.txt
          pip install -e ".[gp]"

      # -W turns warnings into errors, which is the only setting under which a
      # broken cross-reference is anything other than plain text nobody notices.
      # Read the Docs enforces the same thing through fail_on_warning.
      - name: Build
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      # A dead internal link renders as ordinary text. Nothing else catches it.
      - name: Check internal links
        run: python -m sphinx -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
