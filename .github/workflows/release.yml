# Publish a tagged release to PyPI, with no long-lived credentials.
#
# Authentication is OpenID Connect ("Trusted Publishing"). There is no API
# token in this repository's secrets, because there is nothing to steal: PyPI
# mints a short-lived token for this exact workflow, in this exact repository,
# running in the `pypi` environment, and for nothing else.
#
# Triggered only by pushing a tag of the form v1.2.3. The sequence:
#
#   tag -> tests -> build + attest -> TestPyPI -> install & import from
#   TestPyPI -> PyPI (environment `pypi`, may require approval) -> install &
#   import from PyPI -> GitHub release with the artifacts and the changelog.
#
# Nothing reaches pypi.org until the same files installed and imported from
# test.pypi.org.
name: Release

on:
  push:
    tags: ["v*"]

# Nothing is granted by default. Each job asks for exactly what it needs.
permissions: {}

jobs:
  test:
    name: Tests before anything is built
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build and attest
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is generated where the artifact is produced, not where it
      # is uploaded. This job can mint an OIDC token for attestation, but it
      # cannot publish: the PyPI trusted publisher is bound to the `pypi`
      # environment, which only the publish job below runs in.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the build tooling
        # Hashes, not just versions. Scorecard flags `pip install build==1.5.0`
        # exactly as it flags an unpinned one, and it is right to: a version tag
        # can be re-pointed at different bytes, a hash cannot.
        run: pip install --require-hashes -r .github/requirements/build.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Refuse to release if the tag and the package version disagree
        # A tag that does not match pyproject.toml produces a release whose
        # filename says one thing and whose metadata says another. Cheap to
        # check here, confusing forever if it ships.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(ls dist/*.tar.gz | sed -E 's|.*/otwin-(.*)\.tar\.gz|\1|')
          echo "tag=$TAG  package=$PKG"
          test "$TAG" = "$PKG"

      - name: Check the metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Generate build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Keep the attestation bundle alongside the artifacts
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/otwin-${GITHUB_REF_NAME#v}.intoto.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The engine wheel, one per platform. otwin-engine is its own distribution
  # on PyPI; the trusted publisher for it must be registered for this
  # workflow and the `pypi` environment, exactly like otwin's.
  engine-wheels:
    name: engine wheel / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      # Signed provenance for every engine wheel, like the pure-Python
      # distribution above: built on a hosted runner, attested where built.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Refuse to release if the tag and the engine version disagree
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ENG=$(grep -m1 '^version = ' crates/otwin-engine/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$TAG  engine=$ENG"
          test "$TAG" = "$ENG"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/otwin-engine/Cargo.toml -o wheels
          manylinux: auto
      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "wheels/*.whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-wheels-${{ matrix.os }}
          path: wheels/
          retention-days: 7

  testpypi:
    name: Publish both to TestPyPI
    needs: [build, engine-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/otwin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-wheels-*
          path: engine/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: |
          mkdir -p attest && mv dist/*.intoto.jsonl attest/
          ls -la dist engine
      - name: otwin-engine to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: engine/
          skip-existing: true
      - name: otwin to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  smoke-testpypi:
    name: Install and import from TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip install otwin[engine] from TestPyPI, dependencies from PyPI
        # The index needs a moment to serve a fresh upload; retry for a while.
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 12); do
            pip install --index-url https://test.pypi.org/simple/ \
                        --extra-index-url https://pypi.org/simple/ \
                        "otwin[engine]==$V" && break
            echo "not on the index yet (try $i)"; sleep 30
          done
      - name: import otwin and run one model
        run: |
          V="${GITHUB_REF_NAME#v}"
          python - <<PY
          import otwin
          assert otwin.__version__ == "$V", otwin.__version__
          from otwin.components.mechanical import Mass, Spring, Damper, ForceSource, Fixed
          mass, spring, damper = Mass(1.0, name="mass"), Spring(20.0, name="spring"), Damper(0.3, name="damper")
          weight, ceiling = ForceSource(9.81, name="weight"), Fixed(name="ceiling")
          system = mass >> spring >> ceiling
          system.connect(mass.flange, damper.a, weight.flange)
          system.connect(damper.b, ceiling.port)
          model = otwin.compile(system)
          run = model.simulate(t_span=(0, 20), dt=0.05)
          q = run["spring.extension"][-1]
          assert abs(q - weight.force / spring.stiffness) < 0.02, q
          print("otwin", otwin.__version__, "on the", model.backend, "backend: q =", round(float(q), 3), "m")
          PY

  publish-engine:
    name: Publish otwin-engine to PyPI
    needs: smoke-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/otwin-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-wheels-*
          path: dist/
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish:
    name: Publish to PyPI
    needs: publish-engine
    runs-on: ubuntu-latest

    # The environment is the security boundary. PyPI's trusted publisher is
    # configured to accept `pypi` and nothing else, so a workflow change that
    # tried to publish from another job would be rejected by PyPI rather than
    # relying on this file being correct.
    environment:
      name: pypi
      url: https://pypi.org/p/otwin

    permissions:
      id-token: write   # mint the short-lived PyPI token
      contents: write   # attach the artifacts to the GitHub release

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Separate the attestation from the distributions
        # twine uploads everything in dist/, and the bundle is not a
        # distribution.
        run: |
          mkdir -p attest
          mv dist/*.intoto.jsonl attest/
          ls -la dist attest

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No `password:`. No `user:`. Authentication is the OIDC token minted
        # from this job's identity. `attestations` defaults to true for
        # trusted publishing, so the uploaded files carry PyPI-side
        # attestations as well.

      - name: Attach the artifacts and the provenance to the GitHub release
        # Scorecard's Signed-Releases check reads GitHub release assets, and
        # a reader who wants to verify the wheel should not have to dig
        # through Actions logs to find the provenance.
        #
        # `gh release upload` requires the release to exist already. Pushing a
        # tag does NOT create one -- only the web UI's "Draft a new release"
        # does. So a release cut with `git push origin v0.3.0` reached this
        # step, failed with "release not found", and left a red pipeline behind
        # a package that had *already* been published to PyPI. That is the worst
        # available outcome: the version is burned, the upload cannot be
        # retried, and the failure appears after the irreversible step.
        #
        # Creating the release if it is absent makes both paths work, and
        # `--verify-tag` keeps it honest about which commit it is describing.
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repository -- it only downloads the
          # build artifact. With no git remote in the working directory, `gh`
          # cannot work out which repository it is acting on: it shells out to
          # git and dies with "failed to run git: fatal: not a git repository".
          # GH_REPO tells it directly, and is the supported way to run gh
          # outside a checkout.
          #
          # This is what broke v0.3.0. Both branches below were unreachable --
          # the `gh release view` probe failed for this same reason, its stderr
          # was discarded, and the miss was read as "no release exists".
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          # Release notes are the changelog entry for this version, verbatim.
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$GITHUB_REF_NAME" \
            --jq .content | base64 -d > CHANGELOG.md
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; uploading assets"
            gh release upload "$GITHUB_REF_NAME" dist/* attest/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "no release for $GITHUB_REF_NAME; creating it with the assets"
            gh release create "$GITHUB_REF_NAME" dist/* attest/* \
              --title "otwin $V" \
              --notes-file notes.md \
              --verify-tag
          fi

  smoke-pypi:
    name: Install and import from PyPI
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip install otwin[engine]
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 12); do
            pip install "otwin[engine]==$V" && break
            echo "not on the index yet (try $i)"; sleep 30
          done
      - run: |
          V="${GITHUB_REF_NAME#v}"
          python -c "import otwin; assert otwin.__version__ == '$V'; print('pip install otwin ->', otwin.__version__)"
