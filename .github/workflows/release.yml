# Publish a tagged release to PyPI, with no long-lived credentials.
#
# Authentication is OpenID Connect ("Trusted Publishing"). There is no API
# token in this repository's secrets, because there is nothing to steal: PyPI
# mints a short-lived token for this exact workflow, in this exact repository,
# running in the `pypi` environment, and for nothing else.
#
# Triggered only by pushing a tag of the form v1.2.3.
name: Release

on:
  push:
    tags: ["v*"]

# Nothing is granted by default. Each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is generated where the artifact is produced, not where it
      # is uploaded. This job can mint an OIDC token for attestation, but it
      # cannot publish: the PyPI trusted publisher is bound to the `pypi`
      # environment, which only the publish job below runs in.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the build tooling
        # Hashes, not just versions. Scorecard flags `pip install build==1.5.0`
        # exactly as it flags an unpinned one, and it is right to: a version tag
        # can be re-pointed at different bytes, a hash cannot.
        run: pip install --require-hashes -r .github/requirements/build.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Refuse to release if the tag and the package version disagree
        # A tag that does not match pyproject.toml produces a release whose
        # filename says one thing and whose metadata says another. Cheap to
        # check here, confusing forever if it ships.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(ls dist/*.tar.gz | sed -E 's|.*/otwin-(.*)\.tar\.gz|\1|')
          echo "tag=$TAG  package=$PKG"
          test "$TAG" = "$PKG"

      - name: Check the metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Generate build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Keep the attestation bundle alongside the artifacts
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/otwin-${GITHUB_REF_NAME#v}.intoto.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # The environment is the security boundary. PyPI's trusted publisher is
    # configured to accept `pypi` and nothing else, so a workflow change that
    # tried to publish from another job would be rejected by PyPI rather than
    # relying on this file being correct.
    environment:
      name: pypi
      url: https://pypi.org/p/otwin

    permissions:
      id-token: write   # mint the short-lived PyPI token
      contents: write   # attach the artifacts to the GitHub release

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Separate the attestation from the distributions
        # twine uploads everything in dist/, and the bundle is not a
        # distribution.
        run: |
          mkdir -p attest
          mv dist/*.intoto.jsonl attest/
          ls -la dist attest

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No `password:`. No `user:`. Authentication is the OIDC token minted
        # from this job's identity. `attestations` defaults to true for
        # trusted publishing, so the uploaded files carry PyPI-side
        # attestations as well.

      - name: Attach the artifacts and the provenance to the GitHub release
        # Scorecard's Signed-Releases check reads GitHub release assets, and
        # a reader who wants to verify the wheel should not have to dig
        # through Actions logs to find the provenance.
        #
        # `gh release upload` requires the release to exist already. Pushing a
        # tag does NOT create one -- only the web UI's "Draft a new release"
        # does. So a release cut with `git push origin v0.3.0` reached this
        # step, failed with "release not found", and left a red pipeline behind
        # a package that had *already* been published to PyPI. That is the worst
        # available outcome: the version is burned, the upload cannot be
        # retried, and the failure appears after the irreversible step.
        #
        # Creating the release if it is absent makes both paths work, and
        # `--verify-tag` keeps it honest about which commit it is describing.
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repository -- it only downloads the
          # build artifact. With no git remote in the working directory, `gh`
          # cannot work out which repository it is acting on: it shells out to
          # git and dies with "failed to run git: fatal: not a git repository".
          # GH_REPO tells it directly, and is the supported way to run gh
          # outside a checkout.
          #
          # This is what broke v0.3.0. Both branches below were unreachable --
          # the `gh release view` probe failed for this same reason, its stderr
          # was discarded, and the miss was read as "no release exists".
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; uploading assets"
            gh release upload "$GITHUB_REF_NAME" dist/* attest/* --clobber
          else
            echo "no release for $GITHUB_REF_NAME; creating it with the assets"
            gh release create "$GITHUB_REF_NAME" dist/* attest/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
