[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otwin"
version = "0.3.0"
description = "Digital twins whose physics is checked, not claimed. Energy-based models, leakage-free validation, calibrated intervals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Javier Marin", email = "javier@jmarin.info" }]
keywords = [
    "digital-twin",
    "port-hamiltonian",
    "bond-graph",
    "condition-monitoring",
    "prognostics",
    "energy-storage",
    "battery",
    "sunspec",
    "modbus",
    "state-estimation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Base install stays small on purpose. Everything heavier is an extra, and
# nothing under a copyleft licence is ever a hard requirement -- see
# CONTRIBUTING.md, "Dependency licence policy".
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# Field connectors. Both permissively licensed; both optional so that
# `pip install otwin` stays a two-package install for someone who only wants
# the modelling and validation layers.
modbus = ["pymodbus>=3.6,<4.0"]
sunspec = ["pysunspec2>=1.1", "pymodbus>=3.6,<4.0"]
# Learned models and Gaussian-process intervals.
nn = ["torch>=2.0"]
gp = ["scikit-learn>=1.3"]
# Everything a field deployment needs.
field = ["otwin[modbus,sunspec]"]
all = ["otwin[modbus,sunspec,nn,gp]"]
# `dev` deliberately excludes torch. It is a ~2 GB download and only two test
# modules need it; both skip cleanly without it, and test_without_torch.py
# exists to keep the torch-free path green. For the learned-model tests:
#     pip install -e ".[dev,nn]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "otwin[modbus,sunspec,gp]",
]

[project.urls]
Homepage = "https://github.com/otwin-core/otwin"
Documentation = "https://github.com/otwin-core/otwin#readme"
Source = "https://github.com/otwin-core/otwin"
Issues = "https://github.com/otwin-core/otwin/issues"
"Type test" = "https://github.com/otwin-core/otwin-spec"
"Worked example" = "https://github.com/otwin-core/otwin-hybrid"

[tool.hatch.build.targets.wheel]
packages = ["src/otwin"]

# The sdist carries the source needed to build and test the package. It does
# not carry the README artwork: every image in README.md is referenced by an
# absolute raw.githubusercontent.com URL, so the 2.1 MB of PNGs under assets/
# were downloaded by everyone installing from source and displayed to nobody.
[tool.hatch.build.targets.sdist]
# The first four are things a reader of the sdist does not need. The last four
# are things a *local* build picks up that a CI build never sees: run the suite
# once and `.hypothesis/` alone is 67 of the archive's 168 entries. CI builds
# from a fresh checkout so it never noticed, which is precisely why this is
# worth pinning rather than relying on.
exclude = [
    "assets/",
    ".github/",
    "docs/_build/",
    "*.patch",
    ".hypothesis/",
    "__pycache__/",
    ".venv/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules -q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E501",
    # A port-Hamiltonian system IS four functions. `H=lambda x: ...` is the
    # domain notation, it matches the mathematics on the page, and rewriting
    # 37 of them as nested defs would make every model definition longer and
    # harder to read against its own equations. The rule is right in general
    # and wrong here.
    "E731",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
